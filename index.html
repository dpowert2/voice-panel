<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Voice Panel — gen-to-commerce demo</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14181d; --panel2:#1a1f26; --line:#262d36;
    --text:#e6e9ed; --mute:#8b95a3;
    --warn:#ef6b6b; --warn2:#ff9b9b; --ok:#7fd1a1;
    /* per-persona accent colors */
    --vale:#9eccff;   --vale-bg:#1c2a3a;
    --pri:#ffc8b0;    --pri-bg:#2e2520;
    --sam:#a7e0b8;    --sam-bg:#1d2a23;
    --marcus:#d9b3ff; --marcus-bg:#28203a;
    --you:#e6e9ed;    --you-bg:#1a1f26;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
    overflow:hidden;}
  body{display:grid;grid-template-columns:1fr 320px;grid-template-rows:minmax(0,100vh);height:100vh;}

  /* ===== left column: zoom-style tiles ===== */
  main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;}
  header{padding:14px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;justify-content:space-between;flex-shrink:0;}
  header h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.2px;color:var(--mute);
    text-transform:uppercase;}
  header .sub{color:var(--mute);font-size:12px;display:flex;align-items:center;gap:6px}

  #stage{flex:1;display:grid;grid-template-rows:1fr auto;gap:14px;padding:14px;min-height:0;}
  #panel-grid{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);
    gap:14px;min-height:0;}
  #you-row{display:grid;grid-template-columns:1fr;gap:14px;min-height:140px;}

  .tile{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    transition:border-color .25s ease, box-shadow .35s ease, transform .35s ease;
    background:var(--panel);}
  .tile[data-key="vale"]   {background:linear-gradient(135deg,var(--vale-bg) 0%, var(--panel) 100%);}
  .tile[data-key="pri"]    {background:linear-gradient(135deg,var(--pri-bg)  0%, var(--panel) 100%);}
  .tile[data-key="sam"]    {background:linear-gradient(135deg,var(--sam-bg)  0%, var(--panel) 100%);}
  .tile[data-key="marcus"] {background:linear-gradient(135deg,var(--marcus-bg) 0%, var(--panel) 100%);}
  .tile[data-key="you"]    {background:linear-gradient(135deg,var(--you-bg) 0%, var(--panel) 100%);}

  .tile .avatar{display:flex;align-items:center;justify-content:center;
    width:38%;aspect-ratio:1;min-width:90px;max-width:190px;
    border-radius:50%;overflow:hidden;background:rgba(0,0,0,.25);
    border:3px solid rgba(255,255,255,.06);
    box-shadow:0 8px 28px rgba(0,0,0,.45);
    font-size:64px;line-height:1;opacity:.95;
    transition:border-color .35s ease, box-shadow .35s ease;}
  .tile .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .tile.speaking[data-key="vale"]   .avatar{border-color:var(--vale);}
  .tile.speaking[data-key="pri"]    .avatar{border-color:var(--pri);}
  .tile.speaking[data-key="sam"]    .avatar{border-color:var(--sam);}
  .tile.speaking[data-key="marcus"] .avatar{border-color:var(--marcus);}
  .tile.speaking[data-key="you"]    .avatar{border-color:var(--warn);}
  .tile .nameplate{position:absolute;left:12px;bottom:10px;display:flex;align-items:center;gap:8px;
    background:rgba(0,0,0,.42);backdrop-filter:blur(8px);padding:5px 10px;border-radius:8px;
    font-size:13px;font-weight:600;}
  .tile .nameplate .role{font-weight:400;color:var(--mute);font-size:11px}
  .tile .badge{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;letter-spacing:.5px;
    padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.5);color:var(--mute);
    text-transform:uppercase;border:1px solid var(--line);}

  /* speaking-state highlight */
  .tile.speaking{transform:scale(1.015);}
  .tile.speaking[data-key="vale"]   {border-color:var(--vale);   box-shadow:0 0 0 4px rgba(158,204,255,.18), 0 12px 40px rgba(158,204,255,.18);}
  .tile.speaking[data-key="pri"]    {border-color:var(--pri);    box-shadow:0 0 0 4px rgba(255,200,176,.18), 0 12px 40px rgba(255,200,176,.18);}
  .tile.speaking[data-key="sam"]    {border-color:var(--sam);    box-shadow:0 0 0 4px rgba(167,224,184,.18), 0 12px 40px rgba(167,224,184,.18);}
  .tile.speaking[data-key="marcus"] {border-color:var(--marcus); box-shadow:0 0 0 4px rgba(217,179,255,.18), 0 12px 40px rgba(217,179,255,.18);}
  .tile.speaking[data-key="you"]    {border-color:var(--warn);   box-shadow:0 0 0 4px rgba(239,107,107,.18), 0 12px 40px rgba(239,107,107,.18);}

  /* equalizer in the nameplate when speaking */
  .tile .eq{display:none;align-items:flex-end;gap:2px;height:14px;margin-left:2px}
  .tile.speaking .eq{display:inline-flex}
  .tile .eq i{display:block;width:2.5px;background:currentColor;border-radius:1px;
    animation:eq 0.9s ease-in-out infinite;}
  .tile .eq i:nth-child(1){height:40%;animation-delay:-.4s}
  .tile .eq i:nth-child(2){height:80%;animation-delay:-.2s}
  .tile .eq i:nth-child(3){height:55%;animation-delay:-.6s}
  .tile .eq i:nth-child(4){height:90%;animation-delay:0s}
  @keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
  .tile[data-key="vale"]   .eq{color:var(--vale)}
  .tile[data-key="pri"]    .eq{color:var(--pri)}
  .tile[data-key="sam"]    .eq{color:var(--sam)}
  .tile[data-key="marcus"] .eq{color:var(--marcus)}
  .tile[data-key="you"]    .eq{color:var(--warn)}

  /* ===== bottom controls bar ===== */
  #controls{display:flex;gap:8px;align-items:center;padding:10px 14px 14px;border-top:1px solid var(--line);
    background:var(--bg);flex-shrink:0;}
  #controls input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:9px 12px;border-radius:8px;font-size:13px;outline:none;}
  #controls input:focus{border-color:var(--vale)}
  #controls input.listening{border-color:var(--warn);box-shadow:0 0 0 3px rgba(239,107,107,.15);}
  #controls input.mic-error{border-color:var(--warn);color:var(--warn2);}
  #controls input.mic-error::placeholder{color:var(--warn2);}
  #controls button{background:var(--panel);color:var(--text);border:1px solid var(--line);
    padding:9px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;}
  #controls button:hover{border-color:var(--mute)}
  #controls button#mic{font-size:15px;padding:9px 12px;min-width:42px}
  #controls button#mic.recording{background:var(--warn);color:#fff;border-color:var(--warn);
    animation:micpulse 1.2s ease-in-out infinite;}
  #controls button#send{background:var(--vale);color:#0b0d10;border-color:var(--vale);font-weight:600;}
  #controls button#send:disabled{opacity:.4;cursor:not-allowed;background:var(--panel);color:var(--mute);}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(239,107,107,.45)}50%{box-shadow:0 0 0 8px rgba(239,107,107,0)}}

  .pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);
    animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ===== right column: detection feed ===== */
  aside{background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;}
  aside h2{margin:0;padding:14px 16px 10px;font-size:12px;font-weight:600;color:var(--mute);
    text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--line);}
  aside .hint{padding:8px 16px 10px;color:var(--mute);font-size:11px;border-bottom:1px solid var(--line);
    line-height:1.5;}
  aside .hint code{background:var(--panel2);padding:1px 5px;border-radius:3px;font-size:10px;}
  #events{flex:1;overflow-y:auto;padding:8px 10px 14px;font-family:"SF Mono",Menlo,monospace;font-size:11px;}
  .event{padding:7px 9px;border-radius:6px;margin:5px 0;background:var(--panel2);border:1px solid var(--line);}
  .event .row1{display:flex;gap:6px;align-items:baseline;margin-bottom:2px}
  .event .type{color:var(--mute);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
  .event .who{font-weight:600;font-size:11px}
  .event .flag{margin-left:auto;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;
    letter-spacing:.4px;text-transform:uppercase;}
  .event .flag.bad{background:rgba(239,107,107,.18);color:var(--warn2);border:1px solid rgba(239,107,107,.4);}
  .event .flag.ok{background:rgba(127,209,161,.15);color:var(--ok);border:1px solid rgba(127,209,161,.3);}
  .event.bad{border-color:rgba(239,107,107,.45);}
</style>
</head>
<body>
  <main>
    <header>
      <h1>Voice Panel</h1>
      <div class="sub"><span class="pulse"></span><span id="conn">connecting…</span></div>
    </header>

    <div id="stage">
      <section id="panel-grid"></section>
      <section id="you-row"></section>
    </div>

    <div id="controls">
      <button id="mic" title="Click to speak (Chrome/Safari)">🎤</button>
      <input id="msg" placeholder="Type a question, or click 🎤 to speak…" autocomplete="off" />
      <button id="send">Send</button>
      <button id="reset" title="Clear panel state">Reset</button>
    </div>
  </main>

  <aside>
    <h2>Detection Feed</h2>
    <div class="hint">Live SSE event stream — ground-truth <code>is_bad_actor</code> flag included. Wire your detector to <code>GET /events</code>.</div>
    <div id="events"></div>
  </aside>

<script>
const $ = (sel) => document.querySelector(sel);
const gridEl     = $("#panel-grid");
const youRow     = $("#you-row");
const eventsEl   = $("#events");
const inputEl    = $("#msg");
const sendBtn    = $("#send");
const resetBtn   = $("#reset");
const micBtn     = $("#mic");
const connEl     = $("#conn");

const AVATARS = { vale: "🩺", pri: "💊", sam: "🌿", marcus: "💼", you: "🧑" };
const ROLES   = { vale: "GP",  pri: "Pharmacist", sam: "Wellness coach", marcus: "Panelist", you: "Patient" };

let PERSONAS = {};

function renderTile(key, persona, container, opts = {}){
  const tile = document.createElement("div");
  tile.className = "tile"; tile.dataset.key = key; tile.id = `tile-${key}`;
  const badge = opts.badAct ? `<div class="badge">panelist</div>` : "";
  const fallback = AVATARS[key] || "🗣";
  tile.innerHTML = `
    <div class="avatar"><img alt="" /></div>
    ${badge}
    <div class="nameplate">
      <span>${persona.name}</span>
      <span class="role">· ${ROLES[key] || ""}</span>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </div>`;
  const img = tile.querySelector("img");
  // try the photo; if not present (404), swap in the emoji
  img.onerror = () => { img.parentElement.innerHTML = fallback; };
  img.src = `/avatar/${key}?v=${Date.now()}`;  // bust cache during demo dev
  container.appendChild(tile);
  return tile;
}

async function loadPersonas(){
  const r = await fetch("/personas");
  PERSONAS = await r.json();
  gridEl.innerHTML = ""; youRow.innerHTML = "";
  for (const key of Object.keys(PERSONAS)){
    renderTile(key, PERSONAS[key], gridEl, { badAct: false });
  }
  renderTile("you", { name: "You" }, youRow);
}

/* ---- active-speaker highlight --------------------------------- */
function setSpeaking(key){
  document.querySelectorAll(".tile.speaking").forEach(t => t.classList.remove("speaking"));
  if (!key) return;
  const el = document.getElementById(`tile-${key}`);
  if (el) el.classList.add("speaking");
}

/* ---- detection feed (right panel) ---------------------------- */
function addEvent(ev){
  const div = document.createElement("div");
  div.className = "event" + (ev.is_bad_actor ? " bad" : "");
  let body = "";
  if (ev.type === "human"){
    body = `<div class="row1"><span class="type">human</span><span class="who">user</span></div>`;
  } else if (ev.type === "turn"){
    body = `<div class="row1">
              <span class="type">turn</span>
              <span class="who">${ev.speaker}</span>
              <span class="flag ${ev.is_bad_actor ? "bad" : "ok"}">${ev.is_bad_actor ? "BAD ACTOR" : "OK"}</span>
            </div>`;
  } else if (ev.type === "silence"){
    body = `<div class="row1"><span class="type">silence</span></div>`;
  } else if (ev.type === "chain_end"){
    body = `<div class="row1"><span class="type">chain end</span></div>`;
  } else if (ev.type === "chain_cancelled"){
    body = `<div class="row1"><span class="type">cancelled</span></div>`;
  } else if (ev.type === "reset"){
    body = `<div class="row1"><span class="type">reset</span></div>`;
  } else {
    body = `<div class="row1"><span class="type">${ev.type||"event"}</span></div>`;
  }
  div.innerHTML = body;
  eventsEl.appendChild(div);
  eventsEl.scrollTop = eventsEl.scrollHeight;
}

/* ---- serial audio queue, drives speaker highlight ----------- */
const _audioQueue = [];
let _audioPlaying = false;
let _chainActive  = false;

function _playNextAudio(){
  if (_audioQueue.length === 0){
    _audioPlaying = false;
    setSpeaking(null);
    if (!_chainActive) window.__resumeMicAfterAudio?.();
    return;
  }
  _audioPlaying = true;
  window.__pauseMicForAudio?.();
  const { b64, mime, persona_key } = _audioQueue.shift();
  setSpeaking(persona_key);
  const audio = new Audio(`data:${mime};base64,${b64}`);
  const next = () => _playNextAudio();
  audio.onended = next;
  audio.onerror = next;
  audio.play().catch(next);
}

function enqueueAudio(turnEvent){
  if (!turnEvent.audio_b64) return;
  _audioQueue.push({
    b64: turnEvent.audio_b64,
    mime: turnEvent.audio_mime || "audio/mpeg",
    persona_key: turnEvent.persona_key,
  });
  if (!_audioPlaying) _playNextAudio();
}

/* ---- SSE handler --------------------------------------------- */
function handleSSE(ev){
  addEvent(ev);
  if (ev.type === "turn"){
    _chainActive = true;
    enqueueAudio(ev);
  } else if (ev.type === "chain_cancelled"){
    _audioQueue.length = 0;
    _chainActive = false;
  } else if (ev.type === "chain_end"){
    _chainActive = false;
    if (!_audioPlaying){
      setSpeaking(null);
      window.__resumeMicAfterAudio?.();
    }
  } else if (ev.type === "reset"){
    _audioQueue.length = 0; _audioPlaying = false; _chainActive = false;
    setSpeaking(null);
  }
}

function openEventStream(){
  const es = new EventSource("/events");
  es.onopen    = () => { connEl.textContent = "live"; };
  es.onerror   = () => { connEl.textContent = "reconnecting…"; };
  es.onmessage = (m) => {
    try { handleSSE(JSON.parse(m.data)); } catch(e){ console.warn(e); }
  };
}

/* ---- send / reset -------------------------------------------- */
async function send(){
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = ""; sendBtn.disabled = true;
  try {
    await fetch("/turn", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ text }),
    });
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

async function reset(){
  await fetch("/reset", {method:"POST"});
  eventsEl.innerHTML = "";
  _audioQueue.length = 0; _audioPlaying = false; _chainActive = false;
  setSpeaking(null);
}

sendBtn.addEventListener("click", send);
resetBtn.addEventListener("click", reset);
inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

/* ---- always-on voice input ----------------------------------- */
let recognition = null;
let wantsListening = false;
let actuallyListening = false;
let suppressedForAudio = false;
let restartTimer = null;
let lastSentAt = 0;
let lastStartAt = 0;
let consecutiveQuickEnds = 0;   // rapid start→end loop detection
const QUICK_END_MS = 800;
const MAX_QUICK_ENDS = 3;

function setMicError(msg){
  inputEl.classList.add("mic-error");
  inputEl.placeholder = msg;
  micBtn.classList.remove("recording");
}
function clearMicError(){
  inputEl.classList.remove("mic-error");
}

function setupRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){
    micBtn.disabled = true;
    micBtn.title = "Speech recognition not supported — use Chrome or Safari";
    setMicError("Speech recognition not supported — Chrome or Safari required.");
    return null;
  }
  const r = new SR();
  r.continuous = true;
  r.interimResults = true;
  r.lang = "en-US";

  r.onstart = () => {
    actuallyListening = true;
    lastStartAt = Date.now();
    clearMicError();
    micBtn.classList.add("recording");
    inputEl.classList.add("listening");
    inputEl.placeholder = "Listening…";
    setSpeaking("you");
  };
  r.onend = () => {
    actuallyListening = false;
    micBtn.classList.remove("recording");
    inputEl.classList.remove("listening");
    if (!_audioPlaying && !_chainActive) setSpeaking(null);

    // detect rapid start→end loop (no audio detected, mic device idle, etc.)
    const sessionDuration = Date.now() - lastStartAt;
    if (sessionDuration < QUICK_END_MS){
      consecutiveQuickEnds++;
      if (consecutiveQuickEnds >= MAX_QUICK_ENDS){
        wantsListening = false;
        setMicError("Mic not picking up audio. Check the mic input device or grant permission, then click 🎤 to retry.");
        return;
      }
    } else {
      consecutiveQuickEnds = 0;
    }

    inputEl.placeholder = "Type a question, or click 🎤 to speak…";
    if (wantsListening && !suppressedForAudio){
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => { try { r.start(); } catch(_){} }, 200);
    }
  };
  r.onerror = (e) => {
    const err = e.error;
    console.warn("speech recognition error:", err, e);
    // fatal — stop trying
    if (err === "not-allowed" || err === "service-not-allowed"){
      wantsListening = false;
      setMicError("Mic permission denied. Click the 🔒 in the URL bar → Site settings → allow Microphone, then reload.");
      return;
    }
    if (err === "audio-capture"){
      wantsListening = false;
      setMicError("No microphone detected. Check your audio input device.");
      return;
    }
    // normal — happens during silence, the auto-restart in onend recovers
    if (err === "no-speech" || err === "aborted") return;
    // network or other — surface it but keep retrying
    setMicError(`Mic warning: ${err} (will retry…)`);
  };
  r.onresult = (e) => {
    let final = "", interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++){
      const res = e.results[i];
      if (res.isFinal) final += res[0].transcript;
      else interim += res[0].transcript;
    }
    if (interim || final) consecutiveQuickEnds = 0;  // we're getting audio
    if (interim) inputEl.value = interim.trim();
    if (final.trim()){
      const now = Date.now();
      if (now - lastSentAt < 400) return;
      lastSentAt = now;
      inputEl.value = final.trim();
      send();
    }
  };
  return r;
}

/* Probe mic permission via getUserMedia FIRST — gives a clean Chrome prompt
   instead of letting SpeechRecognition silently fail in the background. */
async function ensureMicPermission(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return true;  // older browser; let SpeechRecognition try anyway
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // we only wanted the prompt — release the device immediately so the
    // SpeechRecognition API can claim it next.
    stream.getTracks().forEach(t => t.stop());
    return true;
  } catch (e) {
    console.warn("getUserMedia denied:", e);
    setMicError("Mic permission needed. Allow microphone access for this site, then click 🎤 again.");
    return false;
  }
}

async function startMic(){
  clearMicError();
  consecutiveQuickEnds = 0;
  if (!recognition) recognition = setupRecognition();
  if (!recognition) return;
  const ok = await ensureMicPermission();
  if (!ok) return;
  wantsListening = true;
  if (!actuallyListening){ try { recognition.start(); } catch(_){} }
}
function stopMic(){
  wantsListening = false;
  if (recognition && actuallyListening){ try { recognition.stop(); } catch(_){} }
}
micBtn.addEventListener("click", () => {
  if (wantsListening) stopMic();
  else startMic();
});

window.__pauseMicForAudio = () => {
  if (!wantsListening) return;
  suppressedForAudio = true;
  if (actuallyListening){ try { recognition.stop(); } catch(_){} }
};
window.__resumeMicAfterAudio = () => {
  suppressedForAudio = false;
  if (wantsListening && !actuallyListening){
    clearTimeout(restartTimer);
    restartTimer = setTimeout(() => { try { recognition.start(); } catch(_){} }, 150);
  }
};

(async () => {
  await loadPersonas();
  openEventStream();
  inputEl.focus();
})();
</script>
</body>
</html>
