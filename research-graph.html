<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d10" />
<title>Agent · Quantum — Analyst</title>
<style>
  :root {
    --bg:#0b0d10; --panel:#14181d; --panel2:#1a1f26; --line:#262d36;
    --ink:#e6e9ed; --ink-dim:#8b95a3; --ink-faint:#5b6472;
    --research:#ef6b6b; --news:#7fd1a1; --internal:#9eccff; --flag:#f5d272; --price:#b79cff;
    --header-bg:rgba(11,13,16,.86); --shadow:rgba(0,0,0,.9);
    --mono:"SF Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  }
  :root[data-theme="light"] {
    --bg:#eef1f7; --panel:#ffffff; --panel2:#f4f7fc; --line:#dce3ef;
    --ink:#141a26; --ink-dim:#5a6678; --ink-faint:#97a1b3;
    --research:#e5484d; --news:#0f9d76; --internal:#3567d6; --flag:#bb7d00; --price:#6f4fd6;
    --header-bg:rgba(247,249,253,.82); --shadow:rgba(40,60,110,.16);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; transition:background .3s,color .3s; }
  :root[data-theme="light"] body {
    background:
      radial-gradient(1100px 520px at 82% -12%, rgba(70,120,255,.10), transparent 60%),
      radial-gradient(820px 480px at -6% 112%, rgba(20,200,170,.07), transparent 55%),
      linear-gradient(180deg,#f8fafe,#eaeef6);
    background-attachment:fixed; }
  #app { display:flex; flex-direction:column; height:100dvh; width:100%; max-width:1040px; margin:0 auto;
    padding:max(12px,env(safe-area-inset-top)) 0 max(10px,env(safe-area-inset-bottom)); }

  header { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:0 18px 10px; }
  .brand { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .eyebrow { display:flex; align-items:center; gap:7px; font-family:var(--mono);
    font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-dim); }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--research); flex:none;
    box-shadow:0 0 0 0 rgba(239,107,107,.5); animation:pulse 1.8s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(239,107,107,.45);} 70%{box-shadow:0 0 0 6px rgba(239,107,107,0);} 100%{box-shadow:0 0 0 0 rgba(239,107,107,0);} }
  .brand h1 { margin:0; font-size:16px; font-weight:600; letter-spacing:-.01em; }
  .brand h1 .topic { color:var(--internal); }
  .conviction { text-align:right; flex:none; }
  .conviction .v { font-family:var(--mono); font-size:18px; font-weight:600; }
  .conviction .l { font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin-top:2px; }
  .head-right { display:flex; align-items:center; gap:12px; flex:none; }
  .tt { cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--ink-dim);
    width:34px; height:34px; border-radius:9px; font-size:15px; flex:none; line-height:1;
    display:flex; align-items:center; justify-content:center; transition:border-color .15s,color .15s,background .15s; }
  .tt:hover { border-color:#5a6678; color:var(--ink); }

  /* ---------- focus zone (pinned top) ---------- */
  #focus { margin:0 18px 10px; border:1px solid var(--line); border-radius:13px; overflow:hidden;
    background:linear-gradient(160deg,var(--panel2),var(--panel)); position:relative;
    transition:border-color .3s, box-shadow .3s; }
  #focus.lit { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 24px 56px -34px var(--shadow); }
  #focus::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--accent, linear-gradient(180deg,var(--internal),var(--news))); }
  .focus-pad { padding:14px 17px; }
  .scan-view .tag, .ins-view .tag { font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--accent, var(--internal)); }
  .scan-view .stmt { font-size:14px; line-height:1.5; font-weight:500; margin:6px 0 0; }
  .scan-view .stmt b { color:#fff; font-weight:650; }
  .scan-status { margin-top:10px; font-family:var(--mono); font-size:11px; color:var(--ink-dim);
    display:flex; align-items:center; gap:8px; }
  .scan-status .sp { width:11px; height:11px; border-radius:50%; border:1.5px solid var(--line);
    border-top-color:var(--internal); animation:spin .9s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .ins-view { display:none; }
  #focus.investigate .scan-view { display:none; }
  #focus.investigate .ins-view { display:block; }
  .ins-top { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .badge { font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:3px 8px; border-radius:999px; border:1px solid var(--line); color:var(--ink-dim);
    display:inline-flex; align-items:center; gap:5px; }
  .badge.flag { color:#1a1407; background:var(--flag); border-color:var(--flag); font-weight:700; }
  .badge.risk { color:var(--flag); background:rgba(245,210,114,.08); border-color:#4a4327; }
  .badge.date { color:var(--accent); border-color:color-mix(in srgb,var(--accent) 45%,var(--line)); }
  .ins-h { margin:9px 0 0; font-size:18px; font-weight:650; line-height:1.3; letter-spacing:-.01em; }
  .ins-lead { margin:6px 0 0; font-size:13px; line-height:1.5; color:#c2c9d4; font-style:italic; }
  .ins-foot { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .ins-foot .bar { flex:1; max-width:200px; height:5px; border-radius:4px; background:var(--panel2); overflow:hidden; }
  .ins-foot .fill { height:100%; border-radius:4px; background:var(--accent); }
  .ins-foot .pct { font-family:var(--mono); font-size:11px; color:var(--ink-dim); }
  .ins-foot .back { margin-left:auto; cursor:pointer; border:1px solid var(--line); background:var(--panel);
    color:var(--ink-dim); border-radius:8px; padding:7px 12px; font-family:var(--mono); font-size:11px; }
  .ins-foot .back:hover { color:var(--ink); border-color:#38424f; }

  /* ---------- timeline ---------- */
  .tl-wrap { position:relative; margin:0 18px; }
  .review-badge { position:absolute; top:6px; left:10px; font-family:var(--mono); font-size:10px;
    letter-spacing:.04em; color:var(--ink); background:var(--panel2); border:1px solid var(--line);
    border-radius:999px; padding:4px 11px; white-space:nowrap; opacity:0; transform:translateY(-5px);
    transition:opacity .2s,transform .2s; pointer-events:none; }
  .review-badge.show { opacity:1; transform:translateY(0); }
  #price { position:absolute; top:6px; right:10px; font-family:var(--mono); font-size:10.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:7px; padding:4px 11px; border-radius:999px;
    border:1px solid var(--line); background:var(--panel2); white-space:nowrap; }
  #price i { width:8px; height:3px; border-radius:2px; background:var(--price); box-shadow:0 0 6px var(--price); }
  #price.up { color:#46b888; } #price.down { color:#e5614b; }
  :root[data-theme="light"] #price.up { color:#138a5e; }
  :root[data-theme="light"] #price.down { color:#cc4733; }
  #timeline { display:block; width:100%; height:clamp(170px,30vh,260px); cursor:pointer; touch-action:none; }
  #toast { position:absolute; top:6px; left:50%; transform:translateX(-50%) translateY(-6px);
    font-family:var(--mono); font-size:11px; letter-spacing:.02em; color:#1a1407; background:var(--flag);
    border-radius:999px; padding:6px 14px; font-weight:700; white-space:nowrap; opacity:0;
    transition:opacity .25s, transform .25s; pointer-events:none; box-shadow:0 10px 26px -10px rgba(245,210,114,.5); }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- story (horizontal cards) ---------- */
  .stage { flex:1; min-height:0; display:flex; flex-direction:column; margin-top:10px; }
  .stage-hint { flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
    color:var(--ink-faint); font-family:var(--mono); font-size:12px; line-height:1.6; padding:0 30px; }
  #track { flex:1; min-height:0; display:none; gap:14px; align-items:center; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; position:relative; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  #track.on { display:flex; }
  #track::-webkit-scrollbar { display:none; }
  .card { scroll-snap-align:center; flex:0 0 min(500px,87vw); display:flex; flex-direction:column;
    max-height:100%; border:1px solid var(--line); border-radius:13px; background:var(--panel); overflow:hidden;
    transition:border-color .3s,box-shadow .3s,opacity .3s,transform .3s; opacity:.4; }
  .card.active { opacity:1; border-color:var(--accent); transform:translateY(-2px);
    box-shadow:0 0 0 1px var(--accent), 0 26px 60px -34px var(--shadow); }
  .card .cp { padding:15px 16px; display:flex; flex-direction:column; overflow-y:auto; }
  .step-row { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .step-n { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent); font-weight:600; }
  .step-row .origin { font-family:var(--mono); font-size:10px; color:var(--ink-faint); margin-left:auto; }
  .sd { width:8px; height:8px; border-radius:50%; flex:none; background:var(--accent); }
  .stream { font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--accent); }
  .quote { font-size:14px; line-height:1.55; color:#c8cfd9; }
  .quote mark { background:transparent; color:var(--ink); padding:0 1px; border-radius:3px; border-bottom:1px dashed var(--ink-faint); }
  .card.active .quote mark { background:color-mix(in srgb,var(--accent) 24%,transparent); border-bottom-color:transparent; color:#fff; }
  .reason { margin-top:13px; padding-top:12px; font-size:12.5px; line-height:1.5; color:var(--ink-dim);
    border-top:1px dashed var(--line); display:flex; gap:8px; }
  .reason::before { content:"↳"; color:var(--accent); }

  /* ---------- citations ---------- */
  .src-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .mono-chip { width:26px; height:26px; border-radius:6px; flex:none; display:flex; align-items:center;
    justify-content:center; font-family:var(--mono); font-size:9px; font-weight:700; color:#0b0d10;
    background:var(--accent); letter-spacing:-.02em; }
  .src-num { font-family:var(--mono); font-size:11px; color:var(--accent); font-weight:700; }
  .src-flag { margin-left:auto; font-family:var(--mono); font-size:9px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-faint); display:inline-flex; align-items:center; gap:4px; }
  .src-title { font-size:13.5px; font-weight:600; line-height:1.38; color:var(--ink); margin-bottom:9px; }
  blockquote.quote { margin:0; padding:7px 0 7px 12px; border-left:2px solid var(--accent);
    font-size:13px; line-height:1.55; color:#c8cfd9; }
  .cite-foot { margin-top:10px; font-family:var(--mono); font-size:10px; line-height:1.6;
    color:var(--ink-faint); word-break:break-word; }
  .cite-foot .auth { color:var(--ink-dim); }
  .src-link { color:var(--internal); text-decoration:none;
    border-bottom:1px solid color-mix(in srgb,var(--internal) 40%,transparent); }
  .src-link:hover { border-bottom-color:var(--internal); }
  .src-int { color:var(--ink-dim); }
  sup.cite { cursor:pointer; color:var(--accent,var(--internal)); font-family:var(--mono);
    font-size:9px; font-weight:700; padding:1px 3px; border-radius:4px; margin:0 1px;
    background:color-mix(in srgb,var(--accent,var(--internal)) 16%,transparent);
    vertical-align:super; line-height:0; }
  sup.cite:hover { background:color-mix(in srgb,var(--accent,var(--internal)) 34%,transparent); }
  .card.concl { background:linear-gradient(160deg,var(--panel2),var(--panel)); }
  .card.concl .cp { justify-content:center; }
  .concl .lab { font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
  .concl h4 { margin:9px 0 0; font-size:17px; font-weight:650; line-height:1.32; }
  .concl .cf { display:flex; align-items:center; gap:9px; margin-top:14px; }
  .concl .bar { flex:1; max-width:180px; height:5px; border-radius:4px; background:var(--panel2); overflow:hidden; }
  .concl .fill { height:100%; border-radius:4px; background:var(--accent); }
  .concl .pct { font-family:var(--mono); font-size:11px; color:var(--ink-dim); }

  /* ---------- controls ---------- */
  .controls { display:flex; align-items:center; gap:12px; padding:12px 18px 2px; }
  .btn { cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    height:38px; border-radius:9px; padding:0 14px; font-family:var(--mono); font-size:12px; flex:none;
    display:inline-flex; align-items:center; gap:7px; transition:border-color .15s,background .15s; }
  .btn:hover { border-color:#38424f; background:var(--panel2); }
  .btn.nav { width:38px; padding:0; justify-content:center; font-size:16px; }
  .btn.accent { border-color:#34506e; background:rgba(158,204,255,.08); color:#cfe4ff; }
  .btn.accent:hover { background:rgba(158,204,255,.14); }
  .dots { flex:1; display:flex; justify-content:center; gap:7px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--line); cursor:pointer; transition:.2s; }
  .dot.on { background:var(--accent,var(--internal)); transform:scale(1.25); }
  .spacer { flex:1; }

  /* ---------- narrator ---------- */
  #narrator { position:fixed; left:50%; bottom:calc(86px+env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(10px); z-index:45; max-width:min(640px,92vw);
    background:var(--panel2); border:1px solid var(--accent,#34506e); border-radius:11px; padding:11px 15px;
    display:flex; align-items:center; gap:12px; box-shadow:0 22px 50px -24px var(--shadow);
    opacity:0; pointer-events:none; transition:opacity .25s,transform .25s; }
  #narrator.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  #narrator .av { width:26px; height:26px; border-radius:50%; flex:none; background:var(--accent,#34506e);
    color:#0b0d10; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; font-family:var(--mono); }
  #narrator .txt { font-size:13px; line-height:1.42; }
  #narrator .txt b { color:#fff; }

  @media (max-width:600px) {
    header { padding:0 14px 8px; } .brand h1 { font-size:14px; }
    #focus { margin:0 14px 8px; } .tl-wrap { margin:0 14px; } .controls { padding:10px 14px 2px; }
    .ins-h { font-size:16px; } .scan-view .stmt { font-size:13px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="eyebrow"><span class="live-dot"></span> Agentic Analyst</div>
      <h1>Agent: <span class="topic">Quantum Computing</span></h1>
    </div>
    <div class="head-right">
      <button id="theme-toggle" class="tt" aria-label="Toggle light / dark theme">☀</button>
      <div class="conviction"><div class="v" id="hero-conf">81%</div><div class="l">Thesis conviction</div></div>
    </div>
  </header>

  <div id="focus">
    <div class="focus-pad">
      <div class="scan-view">
        <div class="tag">Working thesis</div>
        <p class="stmt" id="thesis-stmt"></p>
        <div class="scan-status"><span class="sp"></span> <span id="scan-msg">Scanning the data for patterns…</span></div>
      </div>
      <div class="ins-view">
        <div class="ins-top" id="ins-top"></div>
        <h2 class="ins-h" id="ins-h"></h2>
        <p class="ins-lead" id="ins-lead"></p>
        <div class="ins-foot">
          <span class="bar"><span class="fill" id="ins-fill"></span></span>
          <span class="pct" id="ins-pct"></span>
          <button class="back" id="ins-back">← Back to scan</button>
        </div>
      </div>
    </div>
  </div>

  <div class="tl-wrap">
    <canvas id="timeline"></canvas>
    <div id="toast">✦ New insight detected</div>
    <div id="price" class="price up"><i></i>Quantum basket</div>
  </div>

  <div class="stage">
    <div class="stage-hint" id="hint">The agent is scanning the timeline.<br>When it flags a pattern, tap the node to see how it got there.</div>
    <div id="track"></div>
  </div>

  <div class="controls" id="controls"></div>
</div>

<div id="narrator">
  <span class="av">Q</span>
  <span class="txt" id="narr-txt"></span>
</div>

<script>
"use strict";

const STREAM = {
  research:{ c:"#ef6b6b", label:"Research" },
  news:    { c:"#7fd1a1", label:"News" },
  internal:{ c:"#9eccff", label:"Internal · Fidelity" },
};
const KEYS = ["research","news","internal"];

// theme-dependent canvas colors (kept in sync with CSS by applyTheme)
const THEME_CANVAS = {
  dark:  { grid:"rgba(120,140,170,0.05)", axis:"rgba(120,135,160,0.5)",  scan:[158,204,255], candleUp:"#2ebd9b", candleDn:"#ef5350" },
  light: { grid:"rgba(40,70,130,0.09)",   axis:"rgba(70,90,120,0.6)",    scan:[53,103,214], candleUp:"#179e7e", candleDn:"#e5484d" },
};
let tc = Object.assign({ nodeFill:"#14181d" }, THEME_CANVAS.dark);
let priceColor = "#b79cff";

const THESIS = { conf:0.81, stmt:`Quantum is being <b>repriced in plain sight</b> — regulation is making it a <b>compliance mandate</b> while the durable margin sits <b>upstream in the supply chain</b>. I'm assembling that call from the patterns below.` };

const INSIGHTS = [
  { at:150, key:"internal", conf:0.79,
    h:"The margin is migrating to the supply chain, not the chipmakers.",
    lead:"The bottleneck — and the money — is upstream, where the hard engineering actually lives.",
    sources:[
      { key:"internal", tag:"FMR", title:"Cryogenics supply chain: backlog & re-rating", author:"Fidelity Equity Research",
        venue:"Internal · Single-Name Note", date:"Jul 24, 2025", ref:"DESK-2025-0712",
        q:`A dilution-refrigerator supplier guided to a backlog of **7 quarters**; the model moves it from **Hold to Add**.`,
        reason:"A multi-quarter backlog is a hard physical constraint — and it's already forcing a rating change." },
      { key:"news", tag:"BBG", title:"US unveils $1.8 billion push for fault-tolerant quantum", author:"Bloomberg News",
        venue:"Bloomberg", date:"Jul 18, 2025", url:"https://www.bloomberg.com/news/articles/2025-07-18/us-quantum-fault-tolerance-initiative",
        q:`A multi-agency program will fund fault-tolerant hardware with **$1.8B**, milestones tied to logical-qubit counts.`,
        reason:"Public capital at this scale historically pulls private money in behind it." },
      { key:"research", tag:"NP", title:"Telecom-band entanglement between remote superconducting qubits over deployed fibre",
        author:"Chen, L., Okafor, A. et al.", venue:"Nature Photonics", date:"Jul 2025",
        url:"https://www.nature.com/articles/s41566-025-01789-9",
        q:`A photonic link entangled qubits in **separate cryostats over deployed fibre**.`,
        reason:"Even the frontier science routes through cryostats and fibre — that's where value concentrates." },
    ] },
  { at:262, key:"news", conf:0.88, flag:{ kind:"flag", label:"High conviction" },
    h:"Regulation is converting quantum into a mandatory compliance spend.",
    lead:"The driver is shifting from speculative upside to obligation — a far more durable demand base.",
    sources:[
      { key:"news", tag:"FT", title:"Regulators draft post-quantum cryptography timelines for banks", author:"S. Venkataramakrishnan",
        venue:"Financial Times", date:"Sep 5, 2025", url:"https://www.ft.com/content/quantum-pqc-mandate-2025",
        q:`Draft guidance recommends **post-quantum cryptography migration plans** from large institutions by **2027**.`,
        reason:"A migration mandate turns quantum from optional upside into a budgeted obligation." },
      { key:"internal", tag:"FMR", title:"Quantum-theme ETF flows — weekly", author:"Fidelity Flows Desk",
        venue:"Internal · Flows Dashboard", date:"Sep 8, 2025", ref:"FLOW-2025-W36",
        q:`**Three consecutive weeks** of net inflows into quantum ETFs — the **longest streak since launch**.`,
        reason:"And the money is already moving on the rule, not on hardware milestones." },
    ] },
  { at:372, key:"research", conf:0.84, flag:{ kind:"flag", label:"Timeline shift" },
    h:"Fault-tolerance just moved closer — the desk's base case is stale.",
    lead:"The clock moved: useful machines look nearer than our 36-month base case assumed.",
    sources:[
      { key:"research", tag:"arX", title:"Logical error rate below 10⁻⁵ in a reproduced surface-code lattice",
        author:"Acharya, R. et al.", venue:"arXiv:2507.10241 [quant-ph]", date:"Oct 17, 2025",
        url:"https://arxiv.org/abs/2507.10241",
        q:`A 72-qubit surface code held a logical error rate of **8.3×10⁻⁶** — **first sub-threshold result reproduced outside one lab**.`,
        reason:"This is the exact milestone desks gate fault-tolerance timelines on." },
      { key:"internal", tag:"FMR", title:"Expert network call — ex-hardware lead, tier-1 QC vendor", author:"Fidelity Equity Research",
        venue:"Internal · Expert Call", date:"Oct 21, 2025", ref:"EXP-2025-1141",
        q:`A former hardware lead put useful fault-tolerant compute **18–30 months** out, vs our **36-month** base case.`,
        reason:"An insider estimate lands well inside our assumption — the timeline needs re-cutting." },
    ] },
  { at:452, key:"news", conf:0.53, flag:{ kind:"risk", label:"Contrarian · risk" },
    h:"Sentiment is running ahead of substance — keep a hype hedge on.",
    lead:"High media signal, low verified substance — the classic setup for a sentiment unwind.",
    sources:[

const SAMPLES = 480, START = new Date("2025-07-01T08:00:00").getTime(), MS_PER = 3600*1000; // hourly
// deterministic pseudo-random so the graph is stable across redraws
const rnd = (i,s)=>{ const x=Math.sin((i+1)*12.9898 + s*78.233)*43758.5453; return x-Math.floor(x); };
const KEYSEED = { research:1.7, news:5.3, internal:9.1 };
// hourly research activity per stream — spiky peaks with a day/night rhythm
const data = [];
for (let i=0;i<SAMPLES;i++){
  const r={}, day=((i%24)/24)*Math.PI*2;
  for(const k of KEYS){
    const sd=KEYSEED[k];
    const env=0.14 + 0.30*Math.max(0, Math.sin(day - 0.7 + sd));     // busier through the working day
    const n=rnd(i,sd);
    const spike = n>0.80 ? ((n-0.80)/0.20)*0.55 : 0;                  // occasional tall peaks
    let v = env*(0.55+0.5*rnd(i,sd+2.1)) + spike + (rnd(i,sd+4.4)-0.5)*0.05;
    r[k]=Math.max(0.04,Math.min(0.96,v));
  }
  data.push(r);
}
// "Quantum basket" hourly OHLC candles — random walk with an upward drift
const candle=[], price=[]; let _o=100;
for (let i=0;i<SAMPLES;i++){
  const c=_o*(1 + 0.0006 + (rnd(i,21.7)-0.5)*0.013);
  const hi=Math.max(_o,c)*(1 + rnd(i,7.3)*0.004);
  const lo=Math.min(_o,c)*(1 - rnd(i,3.9)*0.004);
  candle.push({o:_o,h:hi,l:lo,c}); price.push(c); _o=c;
}
const PMIN=Math.min(...candle.map(k=>k.l)), PMAX=Math.max(...candle.map(k=>k.h));
const nrm = v => 0.06 + 0.86*((v-PMIN)/((PMAX-PMIN)||1));   // value -> 0..1
const priceY = i => nrm(price[i]);
// peak volume per hour (sum of the three streams) for bar scaling
let maxTotal=0; for(const r of data){ const tt=r.research+r.news+r.internal; if(tt>maxTotal) maxTotal=tt; } maxTotal*=1.06;
// rolling price channel (normalized hi/lo envelope)
const PWIN=8, pHiN=[], pLoN=[];
for(let i=0;i<SAMPLES;i++){ let lo=Infinity,hi=-Infinity;
  for(let j=i-PWIN;j<=i+PWIN;j++){ const idx=Math.max(0,Math.min(SAMPLES-1,j)); if(price[idx]<lo)lo=price[idx]; if(price[idx]>hi)hi=price[idx]; }
  const nrm=v=>0.06+0.86*((v-PMIN)/((PMAX-PMIN)||1)); pLoN[i]=nrm(lo); pHiN[i]=nrm(hi); }
const hexRGB = h=>{ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return ((n>>16)&255)+","+((n>>8)&255)+","+(n&255); };

const mark = s => s.replace(/\*\*(.+?)\*\*/g,"<mark>$1</mark>");
const fmtDate = at => new Date(START+at*MS_PER).toLocaleDateString("en-US",{month:"short",day:"numeric"});
const fmtStamp = at => { const d=new Date(START+at*MS_PER);
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})+", "+String(d.getHours()).padStart(2,"0")+":00"; };

// number every source globally so claims can footnote back to them [n]
let _cn = 0; const CIT = {};
INSIGHTS.forEach((ins,i)=> ins.sources.forEach((s,k)=>{ s.num = ++_cn; CIT[s.num] = { i, k }; }));
const TOTAL_SOURCES = _cn;
const citeSup = nums => nums.map(n=>`<sup class="cite" data-cite="${n}">${n}</sup>`).join("");
const urlLabel = u => u.replace(/^https?:\/\//,"").replace(/\/$/,"");

document.getElementById("thesis-stmt").innerHTML =
  `Quantum is being <b>repriced in plain sight</b> — regulation is making it a <b>compliance mandate</b>${citeSup([4])}, `
  + `while the durable margin sits <b>upstream in the supply chain</b>${citeSup([1,3])} and fault-tolerance now looks `

document.getElementById("hero-conf").textContent = Math.round(THESIS.conf*100)+"%";

// ----------------------------------------------------------------------------
//  Timeline canvas
// ----------------------------------------------------------------------------
const cv = document.getElementById("timeline"), ctx = cv.getContext("2d");
let W=0,H=0; const PAD={t:14,b:20,l:14,r:14};
function fitCanvas(){ const dpr=Math.min(window.devicePixelRatio||1,2); const r=cv.getBoundingClientRect();
  cv.width=Math.max(1,r.width*dpr); cv.height=Math.max(1,r.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); W=r.width; H=r.height; }
const usableX = () => W-PAD.l-PAD.r;
const xAt = idx => PAD.l + (idx/(SAMPLES-1))*usableX();   // whole timeline fits the width

// ----------------------------------------------------------------------------
//  State
// ----------------------------------------------------------------------------
let mode = "scan";          // "scan" | "investigate"
let scanFront = 0;          // sweep position (0..SAMPLES-1) — reveals data as it advances
let scanning = true;        // sweep running
let scanDone = false;       // sweep finished -> settled, nodes clickable
let detectPause = 0;
let selected = -1;
let nodeHit = [];           // current frame's node screen positions for tap hit-testing
const detected = new Set();
const visited = new Set();

const monoFont = sz => sz+"px "+getComputedStyle(document.body).getPropertyValue("--mono");
const SCAN_DUR = 9000;      // ms for the sweep to cross the whole timeline

function drawTimeline(now){
  const dt = now-(drawTimeline._last||now); drawTimeline._last=now;

  // advance the sweep: reveal data left->right, flag patterns, then settle
  if (mode==="scan" && scanning && !scanDone && now>detectPause){
    scanFront = Math.min(SAMPLES-1, scanFront + (SAMPLES/SCAN_DUR)*dt);
    INSIGHTS.forEach((ins,i)=>{ if(!detected.has(i) && scanFront>=ins.at) detect(i); });
    if (scanFront>=SAMPLES-1){ scanDone=true; scanning=false;
      document.getElementById("scan-msg").textContent="Scan complete — "+INSIGHTS.length+" patterns flagged. Tap any circled node to explore.";
      renderControls();
    }
  }

  ctx.clearRect(0,0,W,H);
  const inv = mode==="investigate";
  const activeKeys = inv ? new Set(INSIGHTS[selected].sources.map(s=>s.key)) : null;
  const upTo = (mode==="scan" && !scanDone) ? Math.floor(scanFront) : SAMPLES-1;   // reveal frontier

  // two panes: candles (top) over research/media volume (bottom), shared time axis
  const plotH=H-PAD.t-PAD.b, priceBot=PAD.t+plotH*0.60, volBase=H-PAD.b, volTop=priceBot+13, barMaxH=volBase-volTop;
  const yP = n => priceBot - n*(priceBot-PAD.t);
  const prgb = hexRGB(priceColor);
  const CUP = tc.candleUp, CDN = tc.candleDn;
  const colW = usableX()/(SAMPLES-1), bw = Math.max(1.4, colW*0.62);

  // price-pane grid
  ctx.strokeStyle=tc.grid; ctx.lineWidth=1;
  for(let i=0;i<=3;i++){ const y=PAD.t+(i/3)*(priceBot-PAD.t); ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y); ctx.stroke(); }

  // ---- price channel band (rolling hi/lo envelope), revealed up to the front ----
  ctx.save(); ctx.globalAlpha=inv?0.5:1;
  ctx.beginPath();
  for(let i=0;i<=upTo;i++){ const x=xAt(i), y=yP(pHiN[i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  for(let i=upTo;i>=0;i--){ const x=xAt(i), y=yP(pLoN[i]); ctx.lineTo(x,y); }
  ctx.closePath(); ctx.fillStyle=`rgba(${prgb},0.09)`; ctx.fill();
  ctx.strokeStyle=`rgba(${prgb},0.4)`; ctx.lineWidth=1; ctx.setLineDash([4,3]);
  for(const arr of [pHiN,pLoN]){ ctx.beginPath();
    for(let i=0;i<=upTo;i++){ const x=xAt(i), y=yP(arr[i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke(); }
  ctx.setLineDash([]); ctx.restore();

  // ---- candlesticks (top pane) ----
  for(let i=0;i<=upTo;i++){
    const k=candle[i], x=xAt(i), up=k.c>=k.o, cc=up?CUP:CDN;
    ctx.globalAlpha=inv?0.5:1; ctx.strokeStyle=cc; ctx.fillStyle=cc; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x, yP(nrm(k.h))); ctx.lineTo(x, yP(nrm(k.l))); ctx.stroke();   // wick
    const yo=yP(nrm(k.o)), ycl=yP(nrm(k.c)), top=Math.min(yo,ycl), hgt=Math.max(1.2,Math.abs(yo-ycl));
    ctx.fillRect(x-bw/2, top, bw, hgt);                                                          // body
  }
  ctx.globalAlpha=1;

  // ---- research / media volume bars (bottom pane), stacked by source ----
  for(let i=0;i<=upTo;i++){
    const x=xAt(i); let yc=volBase;
    for(const key of KEYS){ const on=inv?activeKeys.has(key):true, segH=(data[i][key]/maxTotal)*barMaxH;
      ctx.globalAlpha=on?0.9:0.16; ctx.fillStyle=STREAM[key].c; ctx.fillRect(x-bw/2, yc-segH, bw, segH); yc-=segH; }
  }
  ctx.globalAlpha=1;
  ctx.strokeStyle=tc.grid; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(PAD.l,volBase); ctx.lineTo(W-PAD.r,volBase); ctx.stroke();

  // ---- scan reticle at the sweep front ----
  if(mode==="scan" && !scanDone){
    const sx=xAt(scanFront), sc=tc.scan.join(",");
    const g=ctx.createLinearGradient(sx-42,0,sx,0); g.addColorStop(0,`rgba(${sc},0)`); g.addColorStop(1,`rgba(${sc},0.16)`);
    ctx.fillStyle=g; ctx.fillRect(sx-42,PAD.t,42,H-PAD.t-PAD.b);
    ctx.strokeStyle=`rgba(${sc},0.8)`; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(sx,PAD.t); ctx.lineTo(sx,volBase); ctx.stroke(); ctx.setLineDash([]);
  }

  // ---- insight annotations: vertical guide + circled marker on the candle ----
  const t=now/1000; nodeHit=[];
  INSIGHTS.forEach((ins,i)=>{
    if(!(inv ? true : detected.has(i))) return;
    const x=xAt(ins.at), py=yP(priceY(ins.at)), c=STREAM[ins.key].c, crgb=hexRGB(c);
    const emph = inv ? (i===selected) : !visited.has(i);
    const big = inv && i===selected;
    const pulse = 0.5+0.5*Math.sin(t*2.6);
    nodeHit.push({x,y:py,i});
    ctx.strokeStyle=c; ctx.globalAlpha=big?0.5:0.22; ctx.lineWidth=1; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(x,PAD.t); ctx.lineTo(x,volBase); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha=1; ctx.fillStyle=`rgba(${crgb},${big?0.30:0.16})`;
    ctx.beginPath(); ctx.arc(x,py, big?13:10, 0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=c; ctx.lineWidth=1.4; ctx.globalAlpha=emph?(0.55+0.4*pulse):0.85;
    ctx.beginPath(); ctx.arc(x,py, big?13:10, 0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,py, big?3:2.4, 0,Math.PI*2); ctx.fill();
    if(ins.flag){ ctx.fillStyle="#f5d272"; ctx.font=monoFont(9); ctx.textAlign="center";
      ctx.fillText(ins.flag.kind==="risk"?"⚠":"★", x, py-(big?18:14)); }
  });

  // ---- axes + pane labels + live readout ----
  ctx.fillStyle=tc.axis; ctx.textAlign="center"; ctx.font=monoFont(10);
  for(let g=0; g<=4; g++){ const idx=Math.round(g*(SAMPLES-1)/4); ctx.fillText(fmtStamp(idx).split(",")[0], xAt(idx), H-5); }
  ctx.textAlign="left"; ctx.font=monoFont(8.5); ctx.fillStyle=tc.axis;
  ctx.fillText("QUANTUM BASKET · price + channel", PAD.l+2, PAD.t+9);
  ctx.fillText("RESEARCH / MEDIA · items per hour", PAD.l+2, volTop+9);
  { const chg=(price[upTo]/price[0]-1)*100, pe=document.getElementById("price");
    if(pe){ pe.className="price "+(chg>=0?"up":"down");
      pe.innerHTML=`<i></i>Quantum basket ${chg>=0?"▲":"▼"} ${chg>=0?"+":""}${chg.toFixed(1)}% · ${price[upTo].toFixed(1)}`; } }

  requestAnimationFrame(drawTimeline);
}

  for(const n of nodeHit){ const d=(n.x-mx)**2+(n.y-my)**2; if(d<bd){bd=d;best=n.i;} }

// ----------------------------------------------------------------------------
//  Investigate: pin insight to top + tell its story through cards
// ----------------------------------------------------------------------------
const focus=document.getElementById("focus");
const track=document.getElementById("track");
const hint=document.getElementById("hint");
const controls=document.getElementById("controls");
let cards=[], steps=[], stepIdx=0, walkOn=false, walkToken=0;

function investigate(i){
  stopWalk();
  selected=i; visited.add(i); mode="investigate";
  const ins=INSIGHTS[i], accent=STREAM[ins.key].c;
  focus.style.setProperty("--accent",accent); focus.classList.add("investigate","lit");

  // focus header
  const flagBadge = ins.flag ? `<span class="badge ${ins.flag.kind==="risk"?"risk":"flag"}">${ins.flag.kind==="risk"?"⚠":"★"} ${ins.flag.label}</span>` : "";
  document.getElementById("ins-top").innerHTML =
    `<span class="badge date" style="--accent:${accent}">◷ ${fmtStamp(ins.at)}</span>${flagBadge}<span class="badge">${ins.sources.length} sources</span>`;
  document.getElementById("ins-h").textContent = ins.h;
  document.getElementById("ins-lead").innerHTML = "“"+ins.lead+"” " + citeSup(ins.sources.map(s=>s.num));
  document.getElementById("ins-pct").textContent = Math.round(ins.conf*100)+"%";
  document.getElementById("ins-fill").style.width = Math.round(ins.conf*100)+"%";

  // build evidence cards + a conclusion card
  track.innerHTML=""; cards=[]; steps=[];
  ins.sources.forEach((s,k)=>{
    const c=STREAM[s.key].c;
    const ext = !!s.url;
    const link = ext
      ? `<a class="src-link" href="${s.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${urlLabel(s.url)} ↗</a>`
      : `<span class="src-int">🔒 Internal · restricted · ref ${s.ref}</span>`;
    const card=document.createElement("article"); card.className="card"; card.style.setProperty("--accent",c);
    card.innerHTML=`<div class="cp">
      <div class="src-head">
        <span class="mono-chip">${s.tag}</span>
        <span class="src-num">[${s.num}]</span>
        <span class="stream">${STREAM[s.key].label}</span>
        <span class="src-flag">${ext?"Cited source ↗":"🔒 Internal"}</span>
      </div>
      <div class="src-title">${s.title}</div>
      <blockquote class="quote">${mark(s.q)}</blockquote>
      <div class="cite-foot"><span class="auth">${s.author}</span> · ${s.venue} · ${s.date}<br>${link}</div>
      <div class="reason">${s.reason}</div></div>`;
    track.appendChild(card); cards.push(card);
    steps.push({ k:cards.length-1, txt:`<b>Step ${k+1}.</b> ${s.reason} ${citeSup([s.num])}` });
  });
  const cc=document.createElement("article"); cc.className="card concl"; cc.style.setProperty("--accent",accent);
  cc.innerHTML=`<div class="cp"><span class="lab">The insight · sources ${ins.sources.map(s=>"["+s.num+"]").join(" ")}</span>
    <h4>${ins.h}</h4>
    <div class="cf"><span class="bar"><span class="fill" style="width:${Math.round(ins.conf*100)}%"></span></span>
    <span class="pct">${Math.round(ins.conf*100)}% conviction</span></div></div>`;
  track.appendChild(cc); cards.push(cc);
  steps.push({ k:cards.length-1, txt:`<b>So:</b> ${ins.lead} Net ${Math.round(ins.conf*100)}% conviction. ${citeSup(ins.sources.map(s=>s.num))}` });

  cards.forEach((c,k)=> c.addEventListener("click",()=>{ stopWalk(); setStep(k); }));
  hint.style.display="none"; track.classList.add("on");
  layoutTrack(); renderControls();
  setStep(0,false);
  startWalk();   // analyst auto-narrates the trail
}

function backToScan(){
  stopWalk(); mode="scan"; selected=-1;
  focus.classList.remove("investigate","lit"); focus.style.removeProperty("--accent");
  track.classList.remove("on"); track.innerHTML=""; hint.style.display="";
  hint.innerHTML = scanDone
    ? "Scan complete — tap any circled node to revisit how I built it."
    : "The agent is scanning the timeline.<br>When it flags a pattern, tap the circled node to see how it got there.";
  renderControls();
}
document.getElementById("ins-back").onclick = backToScan;

function layoutTrack(){
  if(!cards.length) return;
  const cw=cards[0].getBoundingClientRect().width;
  const pad=Math.max(14,(track.clientWidth-cw)/2);
  track.style.paddingLeft=pad+"px"; track.style.paddingRight=pad+"px";
  scrollToStep(stepIdx,false);
}
function scrollToStep(k,smooth=true){
  const c=cards[k]; if(!c) return;
  const left=c.offsetLeft-(track.clientWidth-c.offsetWidth)/2;
  progScroll=true; track.scrollTo({left,behavior:smooth?"smooth":"auto"});
  clearTimeout(scrollToStep._t); scrollToStep._t=setTimeout(()=>progScroll=false,smooth?480:60);
}
let progScroll=false, rafS=0;
track.addEventListener("scroll",()=>{ if(rafS) return; rafS=requestAnimationFrame(()=>{ rafS=0;
  if(progScroll||mode!=="investigate") return;
  const center=track.scrollLeft+track.clientWidth/2; let best=0,bd=Infinity;
  cards.forEach((c,i)=>{ const cc=c.offsetLeft+c.offsetWidth/2,d=Math.abs(cc-center); if(d<bd){bd=d;best=i;} });
  if(best!==stepIdx){ stopWalk(); setStep(best,true); } }); });

function setStep(k,scroll=true){
  if(k<0||k>=cards.length) return;
  stepIdx=k;
  cards.forEach((c,i)=>c.classList.toggle("active",i===k));
  renderDots();
  narrTxt.innerHTML = steps[k].txt; narrator.classList.add("show");
  if(scroll) scrollToStep(k);
}

// ----------------------------------------------------------------------------
//  Analyst walk (auto-narrate the evidence trail)
// ----------------------------------------------------------------------------
const narrator=document.getElementById("narrator"), narrTxt=document.getElementById("narr-txt");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function startWalk(){ if(walkOn) return; walkOn=true; const tok=++walkToken; runWalk(tok); renderControls(); }
function stopWalk(){ if(!walkOn) return; walkOn=false; walkToken++; renderControls(); }
async function runWalk(tok){
  for(let k=0;k<cards.length;k++){
    if(!walkOn||tok!==walkToken) return;
    setStep(k);
    await sleep(k===0?2600:3200);
  }
  if(walkOn&&tok===walkToken){ walkOn=false; renderControls(); }
}

// ----------------------------------------------------------------------------
//  Controls + dots (contextual)
// ----------------------------------------------------------------------------
function renderControls(){
  controls.innerHTML="";
  if(mode==="scan"){
    const b=document.createElement("button"); b.className="btn";
    if(scanDone){ b.innerHTML="↻ Re-scan"; b.onclick=()=>{ detected.clear(); visited.clear(); scanFront=0; scanDone=false; scanning=true;
        document.getElementById("scan-msg").textContent="Scanning the data for patterns…"; renderControls(); }; }
    else { b.innerHTML = scanning?"⏸ Pause scan":"▶ Resume scan"; b.onclick=()=>{ scanning=!scanning; renderControls(); }; }
    const sk=document.createElement("button"); sk.className="btn"; sk.textContent="Reveal all ⤙";
    sk.onclick=()=>{ INSIGHTS.forEach((_,i)=>detected.add(i)); scanFront=SAMPLES-1; scanDone=true; scanning=false;
      document.getElementById("scan-msg").textContent="Scan complete — "+INSIGHTS.length+" patterns flagged. Tap any circled node to explore."; renderControls(); };
    controls.append(b); const sp=document.createElement("div"); sp.className="spacer"; controls.append(sp,sk);
  } else {
    const back=document.createElement("button"); back.className="btn nav"; back.textContent="‹";
    back.onclick=()=>{ stopWalk(); setStep(stepIdx-1); };
    const fwd=document.createElement("button"); fwd.className="btn nav"; fwd.textContent="›";
    fwd.onclick=()=>{ stopWalk(); setStep(stepIdx+1); };
    const dots=document.createElement("div"); dots.className="dots"; dots.id="dots";
    const walk=document.createElement("button"); walk.className="btn accent";
    walk.innerHTML = walkOn ? "■ Stop" : "↻ Replay walk";
    walk.onclick=()=>{ if(walkOn) stopWalk(); else { setStep(0); startWalk(); } };
    controls.append(back,dots,fwd,walk); renderDots();
  }
}
function renderDots(){
  const d=document.getElementById("dots"); if(!d) return; d.innerHTML="";
  cards.forEach((c,i)=>{ const dot=document.createElement("span"); dot.className="dot"+(i===stepIdx?" on":"");
    dot.style.setProperty("--accent",getComputedStyle(c).getPropertyValue("--accent"));
    dot.onclick=()=>{ stopWalk(); setStep(i); }; d.appendChild(dot); });
}

window.addEventListener("resize",()=>{ fitCanvas(); if(mode==="investigate") layoutTrack(); });
document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape" && mode==="investigate") backToScan();

function applyTheme(name){
  document.documentElement.setAttribute("data-theme", name);
  try { localStorage.setItem("rg-theme", name); } catch(e){}
  const cs = getComputedStyle(document.documentElement);
  STREAM.research.c = cs.getPropertyValue("--research").trim();
  STREAM.news.c     = cs.getPropertyValue("--news").trim();
  STREAM.internal.c = cs.getPropertyValue("--internal").trim();
  tc.nodeFill = cs.getPropertyValue("--panel").trim() || tc.nodeFill;
  priceColor = cs.getPropertyValue("--price").trim() || priceColor;
  Object.assign(tc, THEME_CANVAS[name] || THEME_CANVAS.dark);
  const tb = document.getElementById("theme-toggle"); if(tb) tb.textContent = name==="light" ? "☾" : "☀";
  // rebuild the open insight so card/dot accents pick up the new palette
  if(mode==="investigate" && selected>=0){ const k=stepIdx; investigate(selected); stopWalk(); setStep(k,false); }
}
document.getElementById("theme-toggle").onclick = () =>
  applyTheme(document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light");

// boot
(function(){ let saved="dark"; try { saved = localStorage.getItem("rg-theme") || "dark"; } catch(e){} applyTheme(saved); })();
requestAnimationFrame(()=>{ fitCanvas(); renderControls(); requestAnimationFrame(drawTimeline); });
</script>
</body>
